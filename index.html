<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zero App</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#111111">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      color: #00ff88;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Zero App</h1>

    <p>My first mobile web app</p>

    <button onclick="testApp()">
      Test App
    </button>

    <div id="status"></div>

  </div>

  <script>
    function testApp() {
      document.getElementById("status").innerText =
        "App is working successfully 🚀";
    }

    // Register Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then(() => {
            console.log("Service Worker Registered");
          })
          .catch(error => {
            console.log("Service Worker Error:", error);
          });
      });
    }
  </script>

</body>
</html>
