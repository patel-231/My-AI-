<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Zero App</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#111111">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
        }

        .app {
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
        }

        main {
            padding: 20px;
        }

        .card {
            padding: 30px;
            border-radius: 20px;
            background: #f5f5f5;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <div class="app">

        <header>
            <h1>Zero App</h1>
            <p>My first mobile app</p>
        </header>

        <main>

            <div class="card">

                <h2 id="status">OFF</h2>

                <br>

                <button onclick="toggleApp()">
                    Turn ON
                </button>

            </div>

        </main>

    </div>

    <script>

        let isOn = false;

        function toggleApp() {

            isOn = !isOn;

            document.getElementById("status").innerText =
                isOn ? "ON" : "OFF";

        }

    </script>

</body>

</html>
